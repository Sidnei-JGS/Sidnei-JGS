---
- name: Testar Conexao via CLI no FortiSwitch
  hosts: all
  gather_facts: false
  connection: network_cli

  tasks:
    - name: Coletar status do FortiSwitch via CLI
      ansible.netcommon.cli_command:
        command: show system status
      register: output

    - name: Exibir resultado no console do AWX
      ansible.builtin.debug:
        var: output.stdout_lines
