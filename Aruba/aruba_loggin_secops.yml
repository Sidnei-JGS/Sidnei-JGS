---
- name: 1. Auditar Switches Aruba AOS-CX
  hosts: aruba_cx
  gather_facts: false
  serial: 1

  vars:
    ssh_port: "{{ ansible_port | default(22) }}"
    target_log_server: "log.malwee.com.br"

  tasks:
    - name: Consultar configuracao no Aruba CX
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ansible_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          "(?i)[a-z0-9_.-]+#":
            - "no page"
            - "show running-config | include {{ target_log_server }}"
            - "exit"
        timeout: 60
        echo: true
      delegate_to: localhost
      register: run_config_output
      failed_when: false

    - name: Salvar status de presenca da configuracao
      ansible.builtin.set_fact:
        has_log_configured: "{{ (run_config_output.stdout is defined) and (run_config_output.stdout is search(target_log_server)) }}"
        switch_unreachable: "{{ run_config_output.rc is not defined or run_config_output.rc not in [0, 255] or 'command exceeded timeout' in (run_config_output.msg | default('')) }}"

- name: 2. Gerar Relatorio Consolidado
  hosts: localhost
  gather_facts: false

  vars:
    target_log_server: "log.malwee.com.br"

  tasks:
    - name: Exibir resumo geral de conformidade
      ansible.builtin.debug:
        msg:
          - "======================================================="
          - "RELATORIO GERAL - LOGGING ({{ target_log_server }})"
          - "======================================================="
          - "TOTAL DE SWITCHES AUDITADOS: {{ groups['aruba_cx'] | length }}"
          - "-------------------------------------------------------"
          - "SWITCHES CONFORMES (OK):"
          - "{{ groups['aruba_cx'] | select('extract', hostvars, 'has_log_configured') | list }}"
          - "-------------------------------------------------------"
          - "SWITCHES NAO CONFORMES (SEM O LOGGING):"
          - "{{ groups['aruba_cx'] | reject('extract', hostvars, 'has_log_configured') | reject('extract', hostvars, 'switch_unreachable') | list }}"
          - "-------------------------------------------------------"
          - "SWITCHES COM FALHA DE CONEXAO / TIMEOUT:"
          - "{{ groups['aruba_cx'] | select('extract', hostvars, 'switch_unreachable') | list }}"
          - "======================================================="
