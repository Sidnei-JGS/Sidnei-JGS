---
- name: Verificar Servidor de Log no Aruba AOS-CX
  hosts: aruba_cx
  gather_facts: false
  serial: 1

  vars:
    ssh_port: "{{ ansible_port | default(22) }}"
    target_log.malwee.com.br_line: "log.malwee.com.br"

  tasks:
    - name: 1. Consultar configuracao de log.malwee.com.br no Aruba CX
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ansible_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          "#":
            - "no page"
            - "show running-config | include log.malwee.com.br"
            - "exit"
        timeout: 30
      delegate_to: localhost
      register: run_config_output
      failed_when: run_config_output.rc not in [0, 255]

    - name: 2. Validar se a linha de log.malwee.com.br esta presente
      ansible.builtin.set_fact:
        has_log.malwee.com.br_configured: "{{ target_log.malwee.com.br_line in run_config_output.stdout }}"

    - name: 3. Exibir status da verificacao
      ansible.builtin.debug:
        msg: >-
          Switch: {{ inventory_hostname }} |
          Status: {{ 'PRESENTE (OK)' if has_log.malwee.com.br_configured else 'AUSENTE (NAO CONFIGURADO)' }} |
          Linha buscada: '{{ target_log.malwee.com.br_line }}'

    - name: 4. (Opcional) Sinalizar falha no AWX caso esteja ausente
      ansible.builtin.assert:
        that:
          - has_logging_configured
        fail_msg: "O switch {{ inventory_hostname }} NAO possui a linha '{{ target_log.malwee.com.br_line }}'."
        success_msg: "O switch {{ inventory_hostname }} possui o log.malwee.com.br configurado corretamente."
      ignore_errors: true
