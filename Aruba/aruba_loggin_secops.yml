---
- name: 1. Auditar Switches Aruba AOS-CX
  hosts: aruba_cx
  gather_facts: false
  serial: 1

  vars:
    ssh_port: "{{ ansible_port | default(22) }}"
    target_log_server: "log.malwee.com.br"

  tasks:
    - name: Consultar configuracao no Aruba CX
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ansible_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          "(?i)[a-z0-9_.-]+#":
            - "no page"
            - "show running-config | include {{ target_log_server }}"
            - "exit"
        timeout: 60
        echo: true
      delegate_to: localhost
      register: run_config_output
      failed_when: false

    - name: Salvar status da auditoria
      ansible.builtin.set_fact:
        has_log_configured: "{{ (run_config_output.stdout is defined) and (target_log_server in run_config_output.stdout) }}"
        switch_unreachable: "{{ run_config_output.rc is not defined or run_config_output.rc not in [0, 255] or 'command exceeded timeout' in (run_config_output.msg | default('')) }}"

- name: 2. Gerar Relatorio Consolidado
  hosts: localhost
  gather_facts: false

  vars:
    target_log_server: "log.malwee.com.br"

  tasks:
    - name: Exibir resumo geral de conformidade
      ansible.builtin.debug:
        msg:
          - "======================================================="
          - "RELATORIO GERAL - LOGGING ({{ target_log_server }})"
          - "======================================================="
          - "TOTAL DE SWITCHES AUDITADOS: {{ groups['aruba_cx'] | length }}"
          - "-------------------------------------------------------"
          - "SWITCHES CONFORMES (OK):"
          - >-
            {% set conformes = [] %}
            {% for host in groups['aruba_cx'] %}
              {% if hostvars[host].has_log_configured | default(false) %}
                {% set _ = conformes.append(host) %}
              {% endif %}
            {% endfor %}
            {{ conformes }}
          - "-------------------------------------------------------"
          - "SWITCHES NAO CONFORMES (SEM O LOGGING):"
          - >-
            {% set nao_conformes = [] %}
            {% for host in groups['aruba_cx'] %}
              {% if not (hostvars[host].has_log_configured | default(false)) and not (hostvars[host].switch_unreachable | default(false)) %}
                {% set _ = nao_conformes.append(host) %}
              {% endif %}
            {% endfor %}
            {{ nao_conformes }}
          - "-------------------------------------------------------"
          - "SWITCHES COM FALHA DE CONEXAO / TIMEOUT:"
          - >-
            {% set falhas = [] %}
            {% for host in groups['aruba_cx'] %}
              {% if hostvars[host].switch_unreachable | default(false) %}
                {% set _ = falhas.append(host) %}
              {% endif %}
            {% endfor %}
            {{ falhas }}
          - "======================================================="
