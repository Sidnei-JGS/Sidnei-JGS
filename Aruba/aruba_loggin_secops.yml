---
- name: Verificar Servidor de Log no Aruba AOS-CX
  hosts: aruba_cx
  gather_facts: false
  serial: 1

  vars:
    ssh_port: "{{ ansible_port | default(22) }}"
    target_log_server: "log.malwee.com.br"

  tasks:
    - name: 1. Consultar configuracao no Aruba CX
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ansible_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          "(?i)[a-z0-9_.-]+#":
            - "no page"
            - "show running-config | include {{ target_log_server }}"
            - "exit"
        timeout: 30
        echo: true
      delegate_to: localhost
      register: run_config_output
      # Falha caso a porta esteja fechada, conexao recusada ou timeout
      failed_when: 
        - run_config_output.rc != 0
        - "'Connection refused' in run_config_output.stdout or 'timed out' in run_config_output.stdout"

    - name: 2. Validar se o log server esta presente
      ansible.builtin.set_fact:
        has_log_configured: "{{ run_config_output.stdout is search(target_log_server) }}"

    - name: 3. DEBUG - Inspecionar saida capturada
      ansible.builtin.debug:
        msg:
          - "Captura bruta: {{ run_config_output.stdout }}"
          - "Status detectado: {{ 'PRESENTE (OK)' if has_log_configured else 'AUSENTE (NAO CONFIGURADO)' }}"

    - name: 4. Sinalizar se nao estiver configurado
      ansible.builtin.assert:
        that:
          - has_log_configured
        fail_msg: "O switch {{ inventory_hostname }} NAO possui '{{ target_log_server }}' configurado."
        success_msg: "O switch {{ inventory_hostname }} possui '{{ target_log_server }}' configurado corretamente."
      ignore_errors: true
