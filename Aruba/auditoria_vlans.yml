---
- name: Listar VLANs nos Switches Aruba AOS-CX
  hosts: aruba_cx
  gather_facts: false
  serial: 1

  vars:
    ssh_port: "{{ ansible_port | default(22) }}"
    ssh_user: "{{ ansible_user | default('admin') }}"
    ssh_pass: "{{ ansible_password }}"

  tasks:
    - name: 1. Coletar e Exibir VLANs Existentes via CLI
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ssh_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ssh_pass }}"
          "#":
            - "no page"
            - "show vlan"
            - "exit"
        timeout: 30
        echo: true
      delegate_to: localhost
      register: vlan_output
      failed_when: vlan_output.rc not in [0, 255]

    - name: DEBUG - saída bruta antes do merge
      ansible.builtin.debug:
        var: vlan_output.stdout_lines

    - name: 2. Reconstruir linhas de VLAN quebradas pelo terminal
      ansible.builtin.set_fact:
        vlan_rows_json: >-
          {%- set rows = [] -%}
          {%- set current = namespace(line='') -%}
          {%- for line in vlan_output.stdout_lines -%}
            {%- if line is match('^\s*\d+\s+') -%}
              {%- if current.line -%}{%- set _ = rows.append(current.line) -%}{%- endif -%}
              {%- set current.line = line -%}
            {%- elif current.line and (line is match('^\s*[\d/,\-]+\s*$')) -%}
              {%- set current.line = current.line ~ ' ' ~ (line | trim) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if current.line -%}{%- set _ = rows.append(current.line) -%}{%- endif -%}
          {{ rows | to_json }}

    - name: 3. Exibir tabela de VLANs completa (sem cortes)
      ansible.builtin.debug:
        msg: "{{ vlan_rows_json | from_json }}"
