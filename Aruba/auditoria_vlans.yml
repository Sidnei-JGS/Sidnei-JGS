---
- name: Listar VLANs nos Switches Aruba AOS-CX
  hosts: aruba_cx
  gather_facts: false
  serial: 1

  vars:
    ssh_port: "{{ ansible_port | default(22) }}"

  tasks:
    - name: 1. Coletar e Exibir VLANs Existentes via CLI
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ansible_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          "#": 
            - "no page"
            - "show vlan"
            - "exit"
        timeout: 30
        echo: true
      delegate_to: localhost
      register: vlan_output
      failed_when: vlan_output.rc not in [0, 255]

    - name: 2. Exibir saída formatada das VLANs
      ansible.builtin.debug:
        var: vlan_output.stdout_lines
