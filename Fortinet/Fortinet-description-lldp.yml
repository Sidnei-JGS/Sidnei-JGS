---
- name: Sincronizar Descricoes de Portas via LLDP no FortiSwitch
  hosts: all
  gather_facts: false

  vars:
    ssh_port: "{{ ansible_port | default(22) }}"

  tasks:
    - name: 1. Coletar dados do LLDP no FortiSwitch
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ansible_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          ".*#": "get switch lldp neighbors-summary\nexit\n"
        timeout: 30
      delegate_to: localhost
      register: lldp_output

    - name: 2. Extrair mapeamento de Porta e Vizinho
      ansible.builtin.set_fact:
        lldp_pairs: "{{ lldp_output.stdout | regex_findall('(port\\d+)\\s+.*?\\s+([A-Za-z0-9_\\.-]+)\\s+') }}"

    - name: 3. Filtrar apenas vizinhos validos
      ansible.builtin.set_fact:
        valid_lldp_ports: >-
          {% set valid = [] %}
          {% for pair in lldp_pairs %}
            {% if pair[1] | trim != '-' and pair[1] | trim != '' %}
              {% set _ = valid.append({'port': pair[0], 'name': pair[1] | trim}) %}
            {% endif %}
          {% endfor %}
          {{ valid | to_json }}

    - name: 4. Aplicar descricao passo a passo no terminal
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ansible_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          "SW-201 #": "config switch interface\n"
          "SW-201 \\(interface\\) #": "edit {{ item.port }}\n"
          "SW-201 \\({{ item.port }}\\) #": "set description \"to-{{ item.name }}\"\nnext\nend\nexit\n"
        timeout: 20
      delegate_to: localhost
      loop: "{{ valid_lldp_ports | from_json }}"
      when: (valid_lldp_ports | from_json) | length > 0
      register: apply_desc_output

    - name: 5. Consultar status atualizado das interfaces
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ansible_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          ".*#": "show switch interface | grep -E 'edit|description'\nexit\n"
        timeout: 30
      delegate_to: localhost
      register: audit_output

    - name: 6. Exibir resultado da auditoria
      ansible.builtin.debug:
        var: audit_output.stdout_lines
