---
- name: Criar e verificar VLAN 20 no FortiSwitch
  hosts: switches
  gather_facts: no

  vars_files:
    - secrets.yml

  tasks:
    - name: Definir comandos para criar VLAN 20
      set_fact:
        fortiswitch_commands: |
          config switch vlan
          edit 20
          set description VLAN20
          next
          end
          exit

    - name: Criar VLAN 20
      ansible.builtin.expect:
        command: ssh -o StrictHostKeyChecking=no admin@{{ ansible_host }}
        responses:
          "admin@.*password:": "{{ ssh_password }}"
          "#" : "{{ fortiswitch_commands }}"
        timeout: 30
      delegate_to: localhost
      register: vlan_creation_output

    - name: Aguardar alguns segundos para garantir que as alterações sejam aplicadas
      pause:
        seconds: 2

    - name: Verificar VLANs existentes no switch
      ansible.builtin.expect:
        command: ssh -o StrictHostKeyChecking=no admin@{{ ansible_host }}
        responses:
          "admin@.*password:": "{{ ssh_password }}"
          "#" : "show switch vlan\nexit\n"
        timeout: 30
      delegate_to: localhost
      register: vlan_check_output

#    - name: Exibir saída bruta da verificação
#      debug:
#        var: vlan_check_output.stdout

    - name: Confirmar se VLAN 20 foi criada com sucesso
      debug:
        msg: "✅ VLAN 20 foi encontrada com sucesso!"
      when: vlan_check_output.stdout is search('edit\\s+20')

    - name: Avisar se VLAN 20 não foi encontrada
      debug:
        msg: "❌ VLAN 20 **não** foi encontrada!"
      when: vlan_check_output.stdout is not search('edit\\s+20')
