---
- name: Deletar usuário no FortiSwitch com verificação
  hosts: fortinet
  gather_facts: false

  vars:
    target_username: "{{ username_to_delete | default('') }}"

  tasks:
    - name: 0. Validar se o nome do usuario foi fornecido
      ansible.builtin.fail:
        msg: "Por favor, defina a variável 'username_to_delete' via Survey no AWX."
      when: target_username == ''

    - name: 1. Definir comando para listar usuarios
      ansible.builtin.set_fact:
        check_user_commands: |
          config system admin
          show
          end
          exit

    - name: 2. Verificar se o usuario existe
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ansible_port | default(22) }} {{ ansible_user | default('admin') }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          "[a-zA-Z0-9_.-]+ #": "{{ check_user_commands }}"
        timeout: 60
      delegate_to: localhost
      register: user_check_output
      failed_when: user_check_output.rc not in [0, 255]

    - name: 3. Definir variavel de existencia
      ansible.builtin.set_fact:
        user_exists: "{{ target_username in user_check_output.stdout }}"

    - name: 4. Exibir status do usuario
      ansible.builtin.debug:
        msg: "Usuario '{{ target_username }}' {{ 'encontrado' if user_exists else 'nao encontrado' }} no switch."

    - name: 5. Preparar comandos de remocao
      ansible.builtin.set_fact:
        fortiswitch_delete_commands: |
          config system admin
          delete {{ target_username }}
          end
          exit
      when: user_exists

    - name: 6. Deletar usuario se ele existir
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ansible_port | default(22) }} {{ ansible_user | default('admin') }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          "[a-zA-Z0-9_.-]+ #": "{{ fortiswitch_delete_commands }}"
        timeout: 60
      when: user_exists
      delegate_to: localhost
      register: delete_output
      failed_when: delete_output.rc not in [0, 255]

    - name: 7. Avisar se usuario nao foi encontrado
      ansible.builtin.debug:
        msg: "Usuario '{{ target_username }}' nao foi encontrado. Nada a deletar."
      when: not user_exists
