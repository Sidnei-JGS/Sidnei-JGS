---
- name: Criar e verificar VLAN no FortiSwitch via SSH Expect
  hosts: all
  gather_facts: false

  vars:
    vlan_id: "20"
    vlan_name: "VLAN20"
    ssh_port: "{{ ansible_port | default(22) }}"

  tasks:
    - name: Definir comandos para criar VLAN
      ansible.builtin.set_fact:
        fortiswitch_commands: |
          config switch vlan
          edit {{ vlan_id }}
          set description {{ vlan_name }}
          next
          end
          exit

    - name: Criar VLAN via SSH
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ansible_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          "#": "{{ fortiswitch_commands }}"
        timeout: 30
      delegate_to: localhost
      register: vlan_creation_output

    - name: Aguardar aplicação das alterações
      ansible.builtin.pause:
        seconds: 2

    - name: Verificar VLANs existentes no switch
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -p {{ ssh_port }} {{ ansible_user }}@{{ inventory_hostname }}"
        responses:
          "(?i)password:": "{{ ansible_password }}\n"
          "#": "show switch vlan {{ vlan_id }}\nexit\n"
        timeout: 30
      delegate_to: localhost
      register: vlan_check_output

    - name: Confirmar se a VLAN foi encontrada
      ansible.builtin.debug:
        msg: "✅ VLAN {{ vlan_id }} foi criada com sucesso!"
      when: vlan_check_output.stdout is search('edit\\s+' ~ vlan_id)

    - name: Avisar se a VLAN não foi encontrada
      ansible.builtin.debug:
        msg: "❌ VLAN {{ vlan_id }} NAO foi encontrada!"
      when: vlan_check_output.stdout is not search('edit\\s+' ~ vlan_id)
