---
# =============================================================================
# Auditoria de Spanning-Tree — SOMENTE LEITURA
#
# Plataformas: hp_comware (5 e 7), aruba_cx, fortinet (FortiSwitch standalone)
#              e aruba_os_switch (ProCurve).
# Usa os grupos do inventario em inventory/. Nenhum comando de configuracao e
# enviado: o script files/coleta_somente_leitura.py recusa tudo que nao seja
# display/show/get/diagnose stp.
#
# Credenciais:
#   - senha: credencial de maquina do AWX (ansible_password)
#   - usuario: por plataforma, definido nas EXTRA VARS do job template no AWX
#     (fora do repositorio). Plataforma sem entrada usa o usuario da credencial.
#
#     usuarios_por_plataforma:
#       comware: "usuario@dominio"
#       aruba_cx: "usuario"
#       fortiswitch: "usuario"
#       arubaos_switch: "usuario"
#
# Resultado:
#   - por switch: saida bruta dos comandos (para analise detalhada)
#   - ao final:   relatorio consolidado + artefato "auditoria_stp" no job do AWX
# =============================================================================

- name: Auditoria de Spanning-Tree (somente leitura)
  hosts: "hp_comware:aruba_cx:fortinet:aruba_os_switch"
  gather_facts: false
  any_errors_fatal: false
  strategy: linear

  vars:
    ssh_port: "{{ ansible_port | default(22) }}"
    usuarios_por_plataforma: {}
    ssh_user: >-
      {{ usuarios_por_plataforma[plataforma]
         | default(ansible_user | default(ansible_ssh_user | default(''))) }}
    ssh_pass: "{{ ansible_password | default(ansible_ssh_pass | default(ansible_ssh_password | default(''))) }}"

    plataforma: >-
      {%- if group_names | intersect(['hp_comware', 'hp_comware5', 'hp_comware7']) -%}comware
      {%- elif 'aruba_cx' in group_names -%}aruba_cx
      {%- elif 'fortinet' in group_names -%}fortiswitch
      {%- elif 'aruba_os_switch' in group_names -%}arubaos_switch
      {%- else -%}desconhecida{%- endif -%}

    comandos_stp:
      comware:
        - screen-length disable
        - display stp region-configuration
        - display stp root
        - display stp brief
        - display stp
        - display current-configuration | include stp
      aruba_cx:
        - no page
        - show spanning-tree
        - show spanning-tree mst-config
        - show spanning-tree mst
        - show running-config | include spanning-tree
      arubaos_switch:
        - no page
        - show spanning-tree
        - show spanning-tree mst-config
        - show running-config | include spanning-tree
      fortiswitch:
        - show switch stp settings
        - show switch stp instance
        - diagnose stp instance list
        - diagnose stp mst-config list
        - show switch interface

  tasks:
    - name: 1. Coletar dados de spanning-tree
      ansible.builtin.command:
        cmd: python3 "{{ playbook_dir }}/files/coleta_somente_leitura.py"
      environment:
        TARGET_HOST: "{{ inventory_hostname }}"
        TARGET_USER: "{{ ssh_user }}"
        TARGET_PASS: "{{ ssh_pass }}"
        TARGET_PORT: "{{ ssh_port }}"
        COMANDOS: "{{ comandos_stp[plataforma] | to_json }}"
        LEGACY_SSH: "{{ '1' if plataforma in ['comware', 'arubaos_switch'] else '0' }}"
        TIMEOUT_CMD: "90"
      delegate_to: localhost
      register: coleta
      changed_when: false
      failed_when: false
      when: plataforma != 'desconhecida'

    - name: 2. Montar resumo do switch
      ansible.builtin.set_fact:
        stp_resumo: >-
          {{ ((coleta.stdout_lines | default([]) | select('match', '^RESUMO_JSON: ') | list | last)
              | default('RESUMO_JSON: {}'))[13:] | from_json
             | combine({
                 'ip': inventory_hostname,
                 'hostname': hostname | default(inventory_hostname),
                 'rack': rack | default(''),
                 'modelo': modelo | default(''),
                 'plataforma': plataforma,
                 'coleta_ok': (coleta.rc | default(1)) == 0,
                 'erro': coleta.stderr_lines | default(['plataforma desconhecida'])
                         | select('match', '^(ERRO_DETALHADO|AVISO|plataforma)') | join(' | ')
               }) }}

    - name: 3. Saida bruta (analise detalhada)
      ansible.builtin.debug:
        msg: "{{ coleta.stdout_lines }}"
      when: stp_resumo.coleta_ok

    - name: 4. Falha de coleta (nao interrompe os demais switches)
      ansible.builtin.debug:
        msg: "FALHA {{ stp_resumo.hostname }} ({{ inventory_hostname }}): {{ stp_resumo.erro }}"
      when: not stp_resumo.coleta_ok


    # -------------------------------------------------------------------------
    # Relatorio consolidado: roda UMA vez, no proprio play (run_once), para
    # funcionar mesmo quando o job usa Limit (o Limit tambem filtra localhost).
    # -------------------------------------------------------------------------
    - name: 5. Calcular padrao predominante e divergencias
      run_once: true  # noqa: run-once[task] (play usa strategy linear, o padrao)
      delegate_to: localhost
      vars:
        todos: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('stp_resumo', 'defined')
             | map(attribute='stp_resumo') | list }}
        ok: "{{ todos | selectattr('coleta_ok') | list }}"
      ansible.builtin.set_fact:
        stp_todos: "{{ todos }}"
        analise: >-
          {%- set ns = namespace(nome={}, rev={}, dig={}, modo={}, root={}, macs={}) -%}
          {%- for h in ok -%}
            {%- set mac_root = (h.root | default('', true) | regex_replace('[^0-9A-Fa-f]', '') | lower)[-12:] -%}
            {%- set mac_bridge = (h.bridge | default('', true) | regex_replace('[^0-9A-Fa-f]', '') | lower)[-12:] -%}
            {%- if mac_bridge -%}{%- set _ = ns.macs.update({mac_bridge: h.hostname ~ ' (' ~ h.ip ~ ')'}) -%}{%- endif -%}
            {%- set pares = [('modo', h.modo), ('root', mac_root)] -%}
            {%- if h.modo == 'MSTP' -%}
              {%- set pares = pares + [('nome', h.regiao_nome), ('rev', h.regiao_revisao), ('dig', h.regiao_digest)] -%}
            {%- endif -%}
            {%- for chave, valor in pares -%}
              {%- if valor -%}
                {%- set d = ns[chave] -%}
                {%- set _ = d.update({valor: d.get(valor, 0) + 1}) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- set ref = {} -%}
          {%- for chave in ['nome', 'rev', 'dig', 'modo'] -%}
            {%- set itens = ns[chave] | dict2items | sort(attribute='value', reverse=true) -%}
            {%- set _ = ref.update({chave: (itens | first).key if itens else none}) -%}
          {%- endfor -%}
          {%- set roots = [] -%}
          {%- for mac, qtd in ns.root.items() -%}
            {%- set _ = roots.append({'mac': mac, 'switches_que_apontam': qtd,
                                      'quem_e': ns.macs.get(mac, 'fora do escopo auditado (core/outro equipamento)')}) -%}
          {%- endfor -%}
          {%- set achados = [] -%}
          {%- for h in ok -%}
            {%- set p = [] -%}
            {%- if h.stp_inativo | default(false) -%}
              {%- set _ = p.append('CRITICO: STP sem nenhuma instancia/VLAN ativa ou desabilitado - o switch NAO participa do spanning-tree') -%}
            {%- endif -%}
            {%- if not h.modo -%}
              {%- set _ = p.append('modo nao identificado') -%}
            {%- elif h.modo != ref.modo -%}
              {%- set _ = p.append('modo ' ~ h.modo ~ ' difere do predominante ' ~ ref.modo) -%}
            {%- endif -%}
            {%- if h.modo == 'MSTP' and h.regiao_nome and h.regiao_nome != ref.nome -%}
              {%- set _ = p.append('nome da regiao MST "' ~ h.regiao_nome ~ '" difere do predominante "' ~ ref.nome ~ '"') -%}
            {%- endif -%}
            {%- if h.modo == 'MSTP' and h.regiao_revisao and h.regiao_revisao != ref.rev -%}
              {%- set _ = p.append('revisao MST ' ~ h.regiao_revisao ~ ' difere da predominante ' ~ ref.rev) -%}
            {%- endif -%}
            {%- if h.modo == 'MSTP' and h.regiao_digest and h.regiao_digest != ref.dig -%}
              {%- set _ = p.append('digest MST (mapeamento VLAN x instancia) difere do predominante') -%}
            {%- endif -%}
            {%- if (h.linhas_edge | default(0)) == 0 and h.plataforma != 'fortiswitch' -%}
              {%- set _ = p.append('nenhuma porta edge configurada') -%}
            {%- endif -%}
            {%- if (h.linhas_bpdu_guard | default(0)) == 0 -%}
              {%- set _ = p.append('sem BPDU guard/protection configurado') -%}
            {%- endif -%}
            {%- if p -%}
              {%- set _ = achados.append({'switch': h.hostname ~ ' (' ~ h.ip ~ ')', 'rack': h.rack, 'achados': p}) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set tc = ok | selectattr('tc_recebidos', 'defined') | rejectattr('tc_recebidos', 'none')
                          | sort(attribute='tc_recebidos', reverse=true) -%}
          {{ {'referencia': ref, 'contagem_modo': ns.modo, 'contagem_regiao_nome': ns.nome,
              'contagem_revisao': ns.rev, 'contagem_digest': ns.dig, 'roots_cist': roots,
              'mais_mudancas_topologia': tc[:10] | map(attribute='hostname')
                                         | zip(tc[:10] | map(attribute='tc_recebidos'),
                                               tc[:10] | map(attribute='ultimo_tc'),
                                               tc[:10] | map(attribute='tc_gerados', default='n/d')) | list,
              'achados': achados} }}

    - name: 6. Relatorio
      run_once: true  # noqa: run-once[task] (play usa strategy linear, o padrao)
      delegate_to: localhost
      ansible.builtin.debug:
        msg:
          - "=== AUDITORIA DE SPANNING-TREE ==="
          - >-
            Switches auditados: {{ stp_todos | selectattr('coleta_ok') | list | length }}
            | falhas de coleta: {{ stp_todos | rejectattr('coleta_ok') | list | length }}
          - "Modo STP: {{ analise.contagem_modo }}"
          - >-
            Regiao MST (so switches em MSTP): nomes={{ analise.contagem_regiao_nome }}
            revisoes={{ analise.contagem_revisao }} digests={{ analise.contagem_digest }}
          - "Root CIST: {{ analise.roots_cist }}"
          - >-
            {{ 'OK: todos apontam para o mesmo root' if analise.roots_cist | length <= 1
               else 'ATENCAO: mais de um root = dominios STP separados ou regioes divergentes' }}
          - "Mais mudancas de topologia (switch, TC recebidos, ultimo TC, TC gerados pelo proprio switch): {{ analise.mais_mudancas_topologia }}"
          - >-
            Switches com STP inativo (CRITICO): {{ stp_todos | selectattr('stp_inativo', 'defined')
            | selectattr('stp_inativo') | map(attribute='hostname') | list }}
          - "Switches com achados: {{ analise.achados | length }}"

    - name: 7. Achados por switch
      run_once: true  # noqa: run-once[task] (play usa strategy linear, o padrao)
      delegate_to: localhost
      ansible.builtin.debug:
        msg: "{{ item.switch }} [{{ item.rack }}]: {{ item.achados | join('; ') }}"
      loop: "{{ analise.achados }}"
      loop_control:
        label: "{{ item.switch }}"

    - name: 8. Falhas de coleta
      run_once: true  # noqa: run-once[task] (play usa strategy linear, o padrao)
      delegate_to: localhost
      ansible.builtin.debug:
        msg: "{{ item.hostname }} ({{ item.ip }}): {{ item.erro }}"
      loop: "{{ stp_todos | rejectattr('coleta_ok') | list }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: 9. Publicar artefato no job do AWX
      run_once: true  # noqa: run-once[task] (play usa strategy linear, o padrao)
      delegate_to: localhost
      ansible.builtin.set_stats:
        data:
          auditoria_stp:
            analise: "{{ analise }}"
            switches: "{{ stp_todos }}"
        per_host: false
