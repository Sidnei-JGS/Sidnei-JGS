---
- name: Configurar Padronizacao de Logging no HP Comware v5
  hosts: hp_comware
  gather_facts: false
  serial: 1

  vars:
    ssh_port: "{{ ansible_port | default(22) }}"

  tasks:
    - name: 1. Criar script de aplicacao Paramiko para Logging
      ansible.builtin.copy:
        dest: "/tmp/executa_comware_logging.py"
        mode: "0755"
        content: |
          import os
          import sys
          import time
          import paramiko

          # Força cifras legadas e KEX suportados pelo Comware 5
          paramiko.Transport._preferred_kex = (
              'diffie-hellman-group1-sha1',
              'diffie-hellman-group14-sha1',
              'diffie-hellman-group-exchange-sha1',
              'diffie-hellman-group-exchange-sha256'
          )
          paramiko.Transport._preferred_ciphers = (
              'aes128-cbc', '3des-cbc', 'aes192-cbc', 'aes256-cbc',
              'aes128-ctr', 'aes192-ctr', 'aes256-ctr'
          )
          paramiko.Transport._preferred_keys = ('ssh-rsa', 'ssh-dss')

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())

          host = os.environ.get("TARGET_HOST")
          user = os.environ.get("TARGET_USER")
          password = os.environ.get("TARGET_PASS")
          port = int(os.environ.get("TARGET_PORT", 22))

          try:
              client.connect(
                  host,
                  port=port,
                  username=user,
                  password=password,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=15,
                  disabled_algorithms=dict(kex=[], ciphers=[], pubkeys=[])
              )
              channel = client.invoke_shell()
              time.sleep(1)

              # Sequência com alternância correta entre system-view e user-view
              commands = [
                  "system-view",
                  "info-center source default channel 2 log level alerts",
                  "undo info-center loghost 10.4.4.100",
                  "undo info-center loghost 172.16.3.173",
                  "undo info-center loghost logs.malwee.com.br",
                  "info-center loghost log.malwee.com.br",
                  "return",          # Volta para o modo de usuário <Switch>
                  "save force",       # Salva na flash sem confirmação interativa
                  "screen-length 0 temporary",
                  "display current-configuration | include (info-center|loghost)",
                  "quit"
              ]

              for cmd in commands:
                  channel.send(cmd + "\n")
                  time.sleep(0.8)

              time.sleep(3)

              output = ""
              while channel.recv_ready():
                  output += channel.recv(99999).decode("utf-8", errors="ignore")
                  time.sleep(0.5)

              client.close()
              print(output)
          except Exception as e:
              sys.stderr.write(f"ERRO_DETALHADO: {type(e).__name__} -> {str(e)}\n")
              sys.exit(1)
      delegate_to: localhost

    - name: 2. Executar conexao SSH e aplicar configuracao de log
      ansible.builtin.command: python3 /tmp/executa_comware_logging.py
      environment:
        TARGET_HOST: "{{ inventory_hostname }}"
        TARGET_USER: "{{ ansible_user }}"
        TARGET_PASS: "{{ ansible_password }}"
        TARGET_PORT: "{{ ssh_port }}"
      delegate_to: localhost
      register: resultado_comware
      ignore_errors: true

    - name: 3. Limpar script temporario
      ansible.builtin.file:
        path: "/tmp/executa_comware_logging.py"
        state: absent
      delegate_to: localhost

    - name: 4. Validar resultado da execucao
      ansible.builtin.fail:
        msg:
          - "❌ FALHA AO APLICAR NO SWITCH {{ inventory_hostname }}"
          - "--- MENSAGEM DE ERRO (STDERR) ---"
          - "{{ resultado_comware.stderr_lines }}"
          - "--- SAIDA DO TERMINAL (STDOUT) ---"
          - "{{ resultado_comware.stdout_lines }}"
      when: resultado_comware.rc != 0

    - name: 5. Exibir configuracao ativa resultante
      ansible.builtin.debug:
        msg:
          - "Switch {{ inventory_hostname }} configurado e salvo com sucesso."
          - "{{ resultado_comware.stdout_lines | select('search', 'info-center') | list }}"
